# Checks that need no dataset and no network access beyond installing the pinned packages.
# Job "case-study" (the environment of the recorded runs, Python 3.10.13): manifest, the numbers of the paper and the
# recorded results (case_study/reproduce_paper.py, which also draws the figures from the recorded results), the data
# and the JavaScript of the browser pages, links, the self-tests of the statistics and the post-hoc tests.
# Job "package": the tests and the example of the Python package on three operating systems and three Python versions,
# with the current NumPy.
name: checks
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  case-study:
    runs-on: ubuntu-24.04   # Python 3.10.13 builds of actions/setup-python exist up to Ubuntu 24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install (the post-hoc packages without dependencies, as for the recorded run)
        run: |
          pip install -r case_study/environment/requirements.txt pytest==9.1.1
          pip install --no-deps -r case_study/environment/requirements-posthoc.txt
      - name: Manifest
        run: sha256sum -c --quiet MANIFEST.sha256
      - name: Numbers of the paper, recorded results, supplementary material, figures from the recorded results
        working-directory: case_study
        run: python3 reproduce_paper.py --no-latex
      - name: Data of the results browser and of the interactive pages
        working-directory: case_study
        run: |
          python3 tools/build_explorer_data.py --check
          python3 tools/build_interactive_data.py --check
      - name: Functions of the results browser (Node)
        run: node --test tests/test_explorer.mjs
      - name: Statistics of the interactive pages against the Python code
        run: |
          python3 tests/test_stats_js.py
          python3 tests/test_own_data_js.py
      - name: Links (relative, into this repository and into its GitHub Pages site)
        run: python3 tests/check_links.py
      - name: Self-tests of the statistics
        working-directory: case_study/experiments
        run: |
          python3 m1_range_kitti.py --selftest
          python3 m3_range_nuscenes.py --selftest
      - name: Post-hoc tests (the reproduction of the paper is skipped without the per-detection cache)
        working-directory: case_study
        run: python3 -m pytest -q -rs results/post_hoc/code/tests

  package:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install the package
        run: pip install ./package pytest
      - name: Tests (also against case_study/experiments/m1_range_kitti.py)
        run: python -m pytest -q package/tests
      - name: Example and command line
        run: |
          python package/examples/synthetic_example.py
          python -m applicability_test package/examples/detections_example.csv --selection-condition clear --use-condition rain --alpha 0.05
