<text x='20' y='28' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='16' font-weight='bold' fill='#1a1a1a' text-anchor='start'>Thirty frames, but only three independent units</text>
<text x='20' y='50' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='13' font-weight='normal' fill='#5a5a5a' text-anchor='start'>Frames of one drive share the road, the weather and the traffic: they repeat one another.</text>
