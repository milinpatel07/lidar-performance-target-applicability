<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 960 230' width='960' height='230' role='img' aria-labelledby='t d'><title id='t'>Frames of one drive are not independent</title><desc id='d'>Three recorded drives, each with ten frames. Frames within a drive share road, weather and traffic and look alike, so the thirty frames count as three independent units.</desc>
