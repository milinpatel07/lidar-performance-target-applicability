<rect width='1280' height='10' fill='#1f5fbf'/>
<text x='60' y='92' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='44' font-weight='bold' fill='#1f2328'>Does the threshold still hold?</text>
<text x='60' y='140' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='25' fill='#59636e'>A statistical test of whether an uncertainty threshold that meets its performance target</text>
<text x='60' y='174' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='25' fill='#59636e'>in one condition still meets it under a triggering condition (ISO 21448, SOTIF).</text>
