<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 960 400' width='960' height='400' role='img' aria-labelledby='t d'><title id='t'>How the applicability test works</title><desc id='d'>Schematic in three steps, no data: a threshold on the uncertainty is chosen in one condition, kept unchanged in another condition where more wrong detections fall below it, and an interval of the share of wrong detections passed on is compared with the limit, giving applicable, not determined or not applicable.</desc>
<rect width='960' height='400' fill='white'/>
<defs><marker id='a' viewBox='0 0 10 10' refX='8' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#6e7781'/></marker></defs>
